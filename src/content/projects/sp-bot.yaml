# Source : README du dépôt lutz2cru/sp-bot.
order: 2
kind: case
featured: true
title: { fr: "SP-Bot", en: "SP-Bot" }
summary:
  fr: Un robot qui surveille le SP95 et le SP95-E10 dans 13 stations Total du nord de la Franche-Comté et prévient à chaque rupture ou réapprovisionnement.
  en: A bot that watches SP95 and SP95-E10 fuel at 13 Total stations in northern Franche-Comté and sends an alert on every shortage or restock.
intro:
  fr: Un robot actif 24 h/24 qui surveille les stocks de SP95 et de SP95-E10 dans 13 stations Total entre Vesoul, Lure, Belfort et Montbéliard, et envoie une notification push à chaque rupture ou réapprovisionnement.
  en: A bot running around the clock that monitors SP95 and SP95-E10 stocks at 13 Total stations between Vesoul, Lure, Belfort and Montbéliard, and sends a push notification on every shortage or restock.
domains: [data, infra]
year: "2026"
context: { fr: "Projet personnel", en: "Personal project" }
status: live
stack: [python, github-actions, docker]
extra: [ntfy]
links:
  code: https://github.com/lutz2cru/sp-bot
visual: pipeline
sections:
  - title: { fr: "Ce qu'il fait", en: "What it does" }
    points:
      - fr: "Deux alertes seulement : réapprovisionnement (avec le prix et des liens GPS Google Maps et Waze) et rupture."
        en: "Only two alerts: restock (with the price and Google Maps and Waze links) and shortage."
      - fr: Silence entre deux événements, aucun message tant que la situation ne change pas.
        en: Silence between events, no message as long as nothing changes.
      - fr: Chaque changement est recoupé avec une seconde source officielle avant d'être envoyé.
        en: Every change is cross-checked against a second official source before it is sent.
      - fr: Une alerte reste en file d'attente tant que ntfy n'en a pas accusé réception.
        en: An alert stays queued until ntfy has acknowledged it.
  - title: { fr: "Comment il tourne", en: "How it runs" }
    body:
      fr: Le robot s'exécute toutes les 5 minutes sur GitHub Actions, sans ordinateur allumé et sans clé d'API ; une requête pèse environ 3,7 Ko. Les notifications passent par ntfy, un service de push libre, sans compte ni pistage. Le dépôt fournit aussi un Dockerfile et un docker-compose.
      en: The bot runs every 5 minutes on GitHub Actions, with no computer switched on and no API key; a request weighs about 3.7 KB. Notifications go through ntfy, a free push service with no account and no tracking. The repository also ships a Dockerfile and a docker-compose file.
  - title: { fr: "Zones couvertes", en: "Areas covered" }
    body:
      fr: Belfort, Montbéliard, Lure et l'axe N19, Vesoul.
      en: Belfort, Montbéliard, Lure and the N19 road, Vesoul.
sources: ["github.com/lutz2cru/sp-bot"]
