<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#fff;color:#111827;font-family:system-ui,"Segoe UI",sans-serif;padding:0 120px}
nav{display:flex;justify-content:space-between;align-items:center;height:80px;font-size:16px;border-bottom:1px solid #e5e7eb}

.ph{width:320px;height:320px;border-radius:50%;background:#ddd url(../../../sources/portrait-matthias.jpg) center/cover}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:90px}
