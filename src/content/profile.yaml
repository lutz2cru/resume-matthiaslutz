  bio:
    - fr: Je suis élève ingénieur en informatique par apprentissage à l'UTBM. Depuis septembre 2026, je travaille à l'ARNia BFC, à Dijon, l'agence régionale du numérique et de l'intelligence artificielle de Bourgogne-Franche-Comté, qui fournit des services numériques mutualisés aux collectivités de la région.
      en: I'm a computer science engineering student at UTBM, on a work-study programme. Since September 2026 I've been working at ARNia BFC in Dijon, the Bourgogne-Franche-Comté regional agency for digital technology and AI, which provides shared digital services to the region's local authorities.
    - fr: Avant ça, il y a eu le cycle préparatoire de l'UTBM, un semestre Erasmus à Cracovie, un service civique dans la communication d'un club de handball, et des emplois d'été chez Stellantis et Mister Auto.
      en: Before that came UTBM's preparatory cycle, an Erasmus semester in Krakow, a civic service doing communication for a handball club, and summer jobs at Stellantis and Mister Auto.
    - fr: "J'aime construire des outils simples, fiables et bien documentés, qui servent à des gens que je connais : une application pour la caisse noire d'une équipe, un robot qui surveille les stations-service de la région, une page qui regroupe les fiches de révision de ma promo."
      en: I like building simple, reliable, well-documented tools for people I know — an app for a team's fine kitty, a bot that watches local petrol stations, a page that gathers my class's revision sheets.
    - fr: Le week-end, je suis dans les cages en Nationale 3 au CS Vesoul, le club qui m'a formé, ou au bord du terrain avec un appareil photo.
      en: At weekends I'm in goal in Nationale 3 for CS Vesoul, the club that trained me, or pitchside with a camera.
