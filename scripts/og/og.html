<!doctype html>
<!-- Image de partage (1200 × 630). Générée par scripts/make-assets.mjs avec Chrome sans interface. -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Archivo Variable';
        src: url('../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-stretch: 62% 125%;
      }
      @font-face {
        font-family: 'Martian Mono Variable';
        src: url('../../node_modules/@fontsource-variable/martian-mono/files/martian-mono-latin-standard-normal.woff2') format('woff2');
        font-weight: 100 800;
        font-stretch: 75% 112.5%;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #101319;
        color: #e8edf2;
        font-family: 'Archivo Variable', sans-serif;
      }
      .terrain {
        position: absolute;
        inset: 0;
        background: url('cover.svg') center / cover;
        opacity: 0.55;
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 55%);
        mask-image: linear-gradient(90deg, transparent 0%, #000 55%);
      }
      .content {
        position: absolute;
        inset: 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top,
      .bottom {
        font-family: 'Martian Mono Variable', monospace;
        font-stretch: 87.5%;
        font-size: 17px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #7c8794;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #b6f36a;
      }
      h1 {
        margin: 0;
        font-size: 148px;
        font-stretch: 125%;
        font-weight: 780;
        letter-spacing: -0.045em;
        line-height: 0.86;
      }
      p {
        margin: 26px 0 0;
        max-width: 760px;
        font-size: 30px;
        line-height: 1.3;
        color: #a9b3bf;
      }
      .bottom b {
        color: #e8edf2;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="terrain"></div>
    <div class="content">
      <div class="top"><span class="dot"></span> TULZ — carte personnelle</div>
      <div>
        <h1>Matthias<br />Lutz</h1>
        <p>Apprenti ingénieur Data &amp; IA · UTBM · gardien de but et photographe de sport.</p>
      </div>
      <div class="bottom"><b>tulz.fr</b> · Projets · Parcours · Hors-code</div>
    </div>
  </body>
</html>
