# Source : README du dépôt lutz2cru/thewall.
order: 6
kind: case
featured: true
title: { fr: "The Wall", en: "The Wall" }
summary:
  fr: Toutes les pages de révision de ma promo réunies sur une page, administrée sans serveur par des commits.
  en: All my class's revision pages on a single page, managed without a server through commits.
intro:
  fr: Une seule page qui regroupe toutes les pages de révision de la promo FISA01 Informatique de l'UTBM, rangées par UV, avec une recherche. Les liens se gèrent depuis une interface d'administration, sans toucher au code.
  en: A single page that gathers every revision page of UTBM's FISA01 computer science class, sorted by course, with search. Links are managed from an admin interface, without touching the code.
domains: [web]
year: "2026"
context: { fr: "Pour ma promo à l'UTBM", en: "For my class at UTBM" }
status: live
stack: [javascript, html-css, github-pages, git]
extra: [API GitHub]
links:
  demo: https://lutz2cru.github.io/thewall/
  code: https://github.com/lutz2cru/thewall
shot:
  file: the-wall.png
  date: "2026-11-21"
  alt:
    fr: "Page d'accueil de The Wall : titre, nombre d'UV et de pages, date de mise à jour, champ de recherche et première UV."
    en: "The Wall's home page: title, number of courses and pages, last update, search field and the first course."
sections:
  - title: { fr: "Côté lecteur", en: "For readers" }
    points:
      - fr: "Recherche insensible aux accents, raccourci « / », lien partageable (?q=…)."
        en: "Accent-insensitive search, a “/” shortcut, shareable links (?q=…)."
      - fr: Un badge « nouveau » pendant 14 jours.
        en: A “new” badge for 14 days.
  - title: { fr: "Administration sans serveur", en: "Serverless admin" }
    body:
      fr: Chaque admin se connecte avec son propre token GitHub. Chaque action (ajouter, modifier, déplacer ou retirer une page ou une UV) crée un commit sur un fichier JSON du dépôt, et GitHub Pages republie le site en une minute environ. Aucun serveur, aucune base de données.
      en: Each admin signs in with their own GitHub token. Every action (adding, editing, moving or removing a page or a course) creates a commit on a JSON file in the repository, and GitHub Pages republishes the site in about a minute. No server, no database.
sources: ["github.com/lutz2cru/thewall"]
