# Source : README du dépôt lutz2cru/Projet-LO21-A25.
order: 7
kind: case
title: { fr: "Système expert automobile", en: "Car expert system" }
summary:
  fr: Un moteur d'inférence en C qui déduit un modèle de voiture à partir d'une base de règles.
  en: An inference engine in C that works out a car model from a rule base.
intro:
  fr: Un système expert écrit en C qui déduit un modèle de voiture à partir des caractéristiques données par l'utilisateur. Il repose sur une base de faits, une base de connaissances et un moteur d'inférence à chaînage avant.
  en: An expert system written in C that works out a car model from the features the user gives. It relies on a fact base, a knowledge base and a forward-chaining inference engine.
domains: [systems]
year: "2025"
context: { fr: "Projet de cours UTBM (LO21)", en: "UTBM course project (LO21)" }
status: done
stack: [c]
extra: [Makefile]
links:
  code: https://github.com/lutz2cru/Projet-LO21-A25
sections:
  - title: { fr: "Fonctionnement", en: "How it works" }
    points:
      - fr: Base de faits et base de connaissances représentées par des listes chaînées.
        en: Fact base and knowledge base stored as linked lists.
      - fr: Le moteur applique chaque règle dont la prémisse est satisfaite et ajoute sa conclusion aux faits, jusqu'à stabilisation.
        en: The engine fires every rule whose premise holds and adds its conclusion to the facts, until nothing changes.
      - fr: Un menu pour rechercher un modèle, afficher les règles, ajouter une règle ou vider la base.
        en: A menu to search for a model, list the rules, add a rule or clear the base.
sources: ["github.com/lutz2cru/Projet-LO21-A25"]
