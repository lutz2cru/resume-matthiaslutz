    quote:
      fr: Gardien de but en Nationale 3, au club qui m'a formé.
      en: Goalkeeper in Nationale 3, at the club that trained me.
    text:
      - fr: Je joue au CS Vesoul, en Nationale 3, la cinquième division du handball français. Au poste de gardien, on apprend à rester lucide sous pression, à lire le jeu et à rebondir vite après une erreur — des réflexes qui me servent aussi en projet.
        en: I play for CS Vesoul in Nationale 3, the fifth tier of French handball. As a goalkeeper you learn to stay clear-headed under pressure, read the game and bounce back quickly after a mistake — reflexes that serve me in projects too.
      - fr: J'ai aussi mis ces liens au service du club, en réalisant mon service civique en communication auprès de CSVesoul70 Partenaires.
        en: I also gave back to the club by doing my civic service in communication with CSVesoul70 Partenaires.
