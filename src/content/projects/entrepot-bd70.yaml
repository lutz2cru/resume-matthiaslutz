# Source : README du dépôt lutz2cru/site-logistique-BD70.
order: 5
kind: case
title: { fr: "Gestion d'un entrepôt logistique", en: "Warehouse management system" }
summary:
  fr: Une application PHP et MariaDB pour piloter un entrepôt, testée sur 120 000 lignes de données simulées puis jusqu'à 5 millions de mouvements.
  en: A PHP and MariaDB app to run a warehouse, tested on 120,000 rows of simulated data and then up to 5 million movements.
intro:
  fr: Une application web pour gérer les opérations quotidiennes d'un entrepôt — quais et rendez-vous, flux de camions, réception, emplacements et stocks, préparation et expédition des commandes, traçabilité et indicateurs de pilotage.
  en: A web app for a warehouse's daily operations — docks and appointments, truck flows, goods receipt, locations and stock, order picking and shipping, traceability and management indicators.
domains: [data, web]
year: "2026"
context: { fr: "Projet de cours UTBM (BD70)", en: "UTBM course project (BD70)" }
stack: [php, sql, mariadb, html-css]
extra: [PDO]
links:
  code: https://github.com/lutz2cru/site-logistique-BD70
sections:
  - title: { fr: "La base fait le travail", en: "The database does the work" }
    points:
      - fr: Schéma MariaDB avec séquences, déclencheurs et procédures stockées. Le stock et l'historique des statuts sont tenus par la base, pas par l'application.
        en: A MariaDB schema with sequences, triggers and stored procedures. Stock and status history are maintained by the database, not by the application.
      - fr: Un jeu de démonstration d'environ deux mois d'activité simulée (~120 000 lignes), généré en passant par les déclencheurs, donc conforme à toutes les règles métier.
        en: A demo dataset of about two months of simulated activity (~120,000 rows), generated through the triggers, so it follows every business rule.
      - fr: Un compte applicatif à privilèges réduits. Le site ne se connecte jamais en root et ne peut pas écrire dans les tables tenues par les déclencheurs.
        en: A least-privilege application account. The site never connects as root and cannot write to the tables maintained by triggers.
  - title: { fr: "Montée en charge", en: "Load testing" }
    body:
      fr: Des scripts ajoutent plusieurs années d'historique, jusqu'à 5 millions de mouvements, et mesurent les performances à chaque palier dans un rapport comparatif.
      en: Scripts add several years of history, up to 5 million movements, and measure performance at each step in a comparison report.
sources: ["github.com/lutz2cru/site-logistique-BD70"]
