  erasmus:
    lead:
      fr: Six mois à Cracovie, à l'AGH University of Krakow — et autant d'occasions d'explorer l'Europe centrale, les pays baltes et la Scandinavie.
      en: Six months in Krakow at AGH University — and plenty of chances to explore Central Europe, the Baltics and Scandinavia.
    text:
      fr: "Suivre des cours en anglais, s'organiser seul dans un nouveau pays, voyager avec un budget étudiant : une expérience qui m'a rendu plus autonome et plus à l'aise dans un contexte international."
      en: Taking courses in English, getting organised alone in a new country, travelling on a student budget — an experience that made me more independent and at ease in international settings.
