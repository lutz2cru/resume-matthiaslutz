summary:
  fr: Une application pour gérer la caisse noire d'une équipe de sport, avec amendes, classement et « tribunal ».
  en: An app to run a sports team's fine kitty, with fines, a leaderboard and a team "court".
intro:
  fr: Une application pour gérer la caisse noire d'une équipe de sport. Le trésorier distribue les amendes, chacun suit ce qu'il doit, et toute contestation se règle devant le « tribunal » de l'équipe.
  en: An app to run a sports team's fine kitty. The treasurer hands out fines, everyone can see what they owe, and any dispute is settled before the team's "court".
