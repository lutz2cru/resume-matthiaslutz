<!doctype html>

<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Archivo Variable';
        src: url('../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2');

        margin: 28px 0 0;
        max-width: 900px;
        font-size: 34px;
        line-height: 1.35;
        color: #464b55;
      }
      .sections {
        display: flex;
        gap: 40px;
        margin-top: auto;
        padding-top: 24px;
        border-top: 2px solid #121318;
